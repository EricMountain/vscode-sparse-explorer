version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      # @types/vscode must not exceed engines.vscode (vsce rejects it). Bump
      # both together by hand when raising the minimum supported VS Code.
      - dependency-name: '@types/vscode'
      # ts-jest's peerDependencies cap typescript at "<7" (see PR #39), so a
      # grouped major bump breaks `npm ci` with ERESOLVE. Remove this once
      # ts-jest supports TypeScript 7 — check with:
      #   npm view ts-jest peerDependencies
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
